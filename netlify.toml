[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/quiz-leads"
  to = "/.netlify/functions/quiz-leads"
  status = 200

# Routes applicatives connues : elles restent accessibles en navigation directe.
[[redirects]]
  from = "/promo"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/garantie"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/results"
  to = "/index.html"
  status = 200

# Une URL inconnue ne doit pas devenir une soft-404 HTTP 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Les pages utilitaires du quiz ne doivent pas entrer dans l'index Google.
[[headers]]
  for = "/promo"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/garantie"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/results"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
